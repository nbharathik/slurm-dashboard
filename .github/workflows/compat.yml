name: compat

# sdash against real Slurm 21.08 to 26.05 (distro packages) in throwaway
# Docker clusters. See test/cluster/README.md.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
  push:
    branches: ["release/**"]
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "test/cluster/**"
      - ".github/workflows/compat.yml"

permissions:
  contents: read

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck -S warning -s bash test/cluster/*.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build sdash and the integration test binaries
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p build
          go build -trimpath -o build/sdash ./cmd/sdash
          go test -c -tags integration -o build/integ.test ./internal/integration
          go test -c -tags integration -o build/ui-integ.test ./internal/ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            build/sdash
            build/integ.test
            build/ui-integ.test
          retention-days: 1

  cluster:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        slurm: ["21.08", "22.05", "23.11", "24.11", "25.11", "26.05"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build
      - name: Run Slurm ${{ matrix.slurm }}
        timeout-minutes: 35
        env:
          SDASH_PREBUILT: "1"
        run: |
          chmod +x build/sdash build/integ.test build/ui-integ.test
          bash test/cluster/compat.sh "${{ matrix.slurm }}"
      - name: Make the results readable for the upload
        if: always()
        run: sudo chmod -R a+rX build/compat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compat-${{ matrix.slurm }}
          path: build/compat/${{ matrix.slurm }}
          retention-days: 14

  report:
    needs: cluster
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: compat-*
          path: build/compat
      - name: Grid of Slurm versions and checks
        run: python3 test/cluster/report.py build/compat
