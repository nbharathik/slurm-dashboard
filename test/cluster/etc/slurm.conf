ClusterName=sdashtest
SlurmctldHost=ctld
MailProg=/bin/true
SlurmUser=slurm
SlurmdUser=root
AuthType=auth/munge
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurm/slurmctld.pid
SlurmdPidFile=/run/slurm/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
MpiDefault=none
ReturnToService=2
SlurmdParameters=config_overrides
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
DefMemPerCPU=500
GresTypes=gpu
PriorityType=priority/multifactor
PriorityWeightFairshare=10000
PriorityWeightAge=1000
PriorityWeightJobSize=100
PriorityWeightPartition=100
PriorityWeightQOS=100
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=ctld
AccountingStorageTRES=gres/gpu
AccountingStoreFlags=job_script,job_env
AccountingStorageEnforce=associations,limits,qos
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=3
JobAcctGatherParams=OverMemoryKill
JobCompType=jobcomp/none
MinJobAge=120
InactiveLimit=0
KillWait=5
SlurmctldTimeout=30
SlurmdTimeout=30
Waittime=0

NodeName=c[1-2] CPUs=16 RealMemory=8000 State=UNKNOWN
NodeName=g1 CPUs=16 RealMemory=8000 Gres=gpu:h100:4 Features=h100 State=UNKNOWN
NodeName=down1 NodeAddr=10.255.255.1 CPUs=16 RealMemory=8000 State=UNKNOWN

PartitionName=cpu Nodes=c[1-2],down1 Default=YES MaxTime=7-00:00:00 State=UP
PartitionName=gpu Nodes=g1 MaxTime=2-00:00:00 State=UP
PartitionName=debug Nodes=c1 MaxTime=01:00:00 State=UP
